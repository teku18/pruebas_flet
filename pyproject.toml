# Configuración del proyecto para empaquetar con `flet build` (APK, etc.).
# En la compu se sigue usando requirements.txt (pip install -r requirements.txt).
# Para generar el APK: ./scripts/build_apk.sh  (ver docs/apk.md)

[project]
name = "controlkraken"
version = "1.0.0"            # la versión real la pone el script desde core/APP_VERSION
description = "Tu vida, bajo control"
requires-python = ">=3.12"
# Lo que se instala DENTRO del APK (sin flet[all]: lo de escritorio no va al celular)
dependencies = [
  "flet==1.0.0",
  "flet-charts==1.0.0",
  "SQLAlchemy==2.0.54",
  "alembic==1.20.0",
  "openpyxl==3.1.5",
  "Pillow==12.2.0",
  # Avisos de la Agenda con la app cerrada (Flutter flutter_local_notifications).
  # Necesita un parche al proyecto Android: lo aplica scripts/build_apk.sh.
  "flet-android-notifications==0.12.0",
  # Kraken Tools: cliente HTTP (async, se puede cancelar). Puro Python.
  "httpx==0.28.1",
  # Kraken Tools · Red: consultas DNS (MX, TXT, NS…) a un servidor elegido. Puro Python.
  "dnspython==2.8.0",
]

[tool.flet]
org = "com.teku18"            # id de la app: com.teku18.controlkraken (¡no cambiarlo después!)
product = "ControlKraken"     # nombre que se ve debajo del ícono
company = "teku18"
copyright = "Copyright (C) 2026 teku18"

[tool.flet.app]
path = "."
# Lo que NO va dentro del APK: tus datos personales y archivos de trabajo
exclude = [
  "ControlKraken.db",
  "movimientos.db",
  "movimientos_respaldo.db",
  "data",
  "respaldos",
  "docs",
  "scripts",
  "pruebas",                 # apps de prueba aparte (p. ej. avisos)
  ".flet",
  ".venv",
  ".idea",
  ".git",
  "build",
]

[tool.flet.compile]
app = false                   # deja los .py (Alembic lee las migraciones como archivos)

[tool.flet.android]
target_arch = ["arm64-v8a"]   # celulares modernos; APK más ligero

# Permisos de Android (AndroidManifest.xml):
#   INTERNET                Kraken Tools (cliente HTTP). Flet ya lo pone; aquí queda a la vista
#   POST_NOTIFICATIONS      mostrar avisos (Android 13+ lo pregunta al abrir)
#   SCHEDULE_EXACT_ALARM    avisos a la hora exacta (Configuración → Avisos)
#   RECEIVE_BOOT_COMPLETED  volver a programarlos al reiniciar el celular
[tool.flet.android.permission]
"android.permission.INTERNET" = true
"android.permission.POST_NOTIFICATIONS" = true
"android.permission.SCHEDULE_EXACT_ALARM" = true
"android.permission.RECEIVE_BOOT_COMPLETED" = true

[tool.flet.android.signing]
key_alias = "upload"          # la ruta y contraseñas de la llave las pone scripts/build_apk.sh

# Ajustes de paquetes de Flutter (los aplica flet build al pubspec.yaml).
# jni_flutter 1.0.4 pide jni >= 1.1, pero la plantilla de Flet 1.0.0 fija jni 1.0.0
# -> "The generated bindings expect package:jni ^1.1.0, but 1.0.x was imported".
# Se usa la versión anterior de jni_flutter, compatible con jni 1.0.0.
[tool.flet.flutter.pubspec.dependency_overrides]
jni_flutter = ">=1.0.0 <1.0.4"
