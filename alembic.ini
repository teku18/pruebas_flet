# Configuración de Alembic para usarlo desde la terminal:
#   alembic revision --autogenerate -m "describe el cambio"
#   alembic upgrade head
#   alembic downgrade -1
#   alembic history
# La URL de la BD se toma de core/database.py (ver alembic/env.py).

[alembic]
script_location = alembic
prepend_sys_path = .
# Nombre de archivo: 0003_agrega_hora.py (número de revisión + mensaje)
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
