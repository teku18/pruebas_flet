# PRUEBA de SSH (no es ControlKraken). Ver README.md.
[project]
name = "cksshprueba"
version = "0.1.0"
description = "Prueba de SSH (paramiko) dentro del APK"
requires-python = ">=3.12"
# paramiko es puro Python; sus piezas en C (cryptography, bcrypt, PyNaCl, cffi)
# se fijan a versiones que Flet tiene compiladas para Android
# (https://flet.dev/docs/reference/binary-packages-android-ios/)
dependencies = [
  "flet==1.0.0",
  "paramiko==5.0.0",
  "cryptography==48.0.0",
  "bcrypt==5.0.0",
  "pynacl==1.6.2",
  "cffi==2.0.0",
]

[tool.flet]
org = "com.teku18"
product = "CK Prueba SSH"      # otro nombre e id: se instala junto a ControlKraken

[tool.flet.android]
target_arch = ["arm64-v8a"]

[tool.flet.android.permission]
"android.permission.INTERNET" = true

# Mismo ajuste que ControlKraken para compilar con Flet 1.0.0
[tool.flet.flutter.pubspec.dependency_overrides]
jni_flutter = ">=1.0.0 <1.0.4"
