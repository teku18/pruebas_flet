# PRUEBA de notificaciones (no es ControlKraken). Ver README.md.
[project]
name = "cknotifprueba"
version = "0.1.0"
description = "Prueba de avisos con la app cerrada"
requires-python = ">=3.12"
dependencies = [
  "flet==1.0.0",
  "flet-android-notifications==0.12.0",
]

[tool.flet]
org = "com.teku18"
product = "CK Prueba avisos"   # otro nombre e id: se instala junto a ControlKraken

[tool.flet.android]
target_arch = ["arm64-v8a"]

# Permisos en el AndroidManifest (el parche agrega los de recibir avisos y
# arrancar con el celular; las alarmas EXACTAS hay que pedirlas aquí)
[tool.flet.android.permission]
"android.permission.POST_NOTIFICATIONS" = true
"android.permission.SCHEDULE_EXACT_ALARM" = true
"android.permission.RECEIVE_BOOT_COMPLETED" = true

# Mismo ajuste que ControlKraken para compilar con Flet 1.0.0
[tool.flet.flutter.pubspec.dependency_overrides]
jni_flutter = ">=1.0.0 <1.0.4"
